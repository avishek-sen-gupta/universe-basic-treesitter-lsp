[project]
name = "universe-basic-lsp"
version = "0.1.0"
description = "LSP server for UniVerse BASIC"
authors = [
    {name = "asgupta"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "pygls (>=2.0.1,<3.0.0)",
    "tree-sitter (>=0.25.2,<0.26.0)"
]


[project.scripts]
universe-basic-lsp = "universe_basic_lsp.__main__:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"

